<body class="bg-gradient-to-br from-background to-surface-container-low text-on-background antialiased min-h-screen pb-safe pb-[80px] pt-[64px]">
<!-- TopAppBar -->
<header class="bg-surface-container/80 backdrop-blur-md fixed top-0 w-full z-50 border-b border-glass-stroke shadow-sm">
<div class="flex justify-between items-center px-margin-mobile h-[64px] w-full">
<button class="text-on-surface transition-colors duration-200 active:opacity-80 hover:bg-surface-variant/50 p-2 rounded-full flex items-center justify-center">

</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface tracking-tight">ZoFranca CR</h1>
<button class="text-on-surface transition-colors duration-200 active:opacity-80 hover:bg-surface-variant/50 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<main class="p-margin-mobile max-w-4xl mx-auto space-y-section-gap mt-element-gap">
<section class="space-y-gutter">
<div>
<h2 class="font-headline-md text-headline-md text-on-background font-semibold">Solicitudes Pendientes</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Revisa y gestiona las solicitudes de régimen de zona franca.</p>
</div>
</section>
<!-- Requests List -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-gutter" id="solicitudesContainer">
    <div id="tableLoader" class="text-center w-full col-span-1 md:col-span-2 py-8 text-on-surface-variant">
        Cargando solicitudes...
    </div>
</section>
</main>
<nav class="fixed bottom-0 w-full z-50 h-[80px] bg-surface-container/90 backdrop-blur-xl border-t border-glass-stroke md:hidden pb-safe flex justify-around items-center px-2">
